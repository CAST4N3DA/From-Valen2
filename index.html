<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mucho Éxito!</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Patines detallados en constante movimiento por el fondo -->
    <div class="pista-patinaje">
        <div class="patin-movil pm-1">
            <svg viewBox="0 0 100 100" width="100" height="100">
                <path d="M25,20 L45,20 L50,30 L55,55 L25,55 L20,35 Z" fill="#ffffff" opacity="0.25"/>
                <path d="M25,55 L55,55 L55,60 L25,60 Z" fill="#8b5a2b" opacity="0.4"/>
                <circle cx="30" cy="68" r="7" fill="#ffffff" opacity="0.3"/>
                <circle cx="50" cy="68" r="7" fill="#ffffff" opacity="0.3"/>
                <path d="M28,25 L28,50 M34,25 L34,50 M40,25 L40,50" stroke="#8b5a2b" stroke-width="2" opacity="0.4"/>
            </svg>
        </div>
        <div class="patin-movil pm-2">
            <svg viewBox="0 0 100 100" width="120" height="120">
                <path d="M25,20 L45,20 L50,30 L55,55 L25,55 L20,35 Z" fill="#ffffff" opacity="0.2"/>
                <path d="M25,55 L55,55 L55,60 L25,60 Z" fill="#8b5a2b" opacity="0.3"/>
                <circle cx="30" cy="68" r="7" fill="#ffffff" opacity="0.25"/>
                <circle cx="50" cy="68" r="7" fill="#ffffff" opacity="0.25"/>
                <path d="M28,25 L28,50 M34,25 L34,50 M40,25 L40,50" stroke="#8b5a2b" stroke-width="2" opacity="0.3"/>
            </svg>
        </div>
    </div>

    <div class="contenedor">
        <h1 class="patinaje-titulo">¡A Rodar!</h1>
        <p class="mensaje-principal">Mucha suerte en tu regreso al patinajee, te quieroo.</p>
        <p class="firma">Con mucho amor ✨</p>
    </div>

</body>
</html>
