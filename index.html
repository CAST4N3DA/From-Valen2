<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Mucho Éxito!</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <!-- Los patines reales de colores en movimiento fluido continuo de fondo -->
    <div class="pista-patinaje">
        <div class="patin-movil pm-1">
            <svg viewBox="0 0 100 100" width="100" height="100">
                <path d="M25,20 L45,20 L50,30 L55,55 L25,55 L20,35 Z" fill="#ffffff" opacity="0.8"/>
                <path d="M25,55 L55,55 L55,60 L25,60 Z" fill="#4a4a4a"/>
                <circle cx="30" cy="68" r="9" fill="#ff6b81"/>
                <circle cx="30" cy="68" r="4" fill="#ffffff"/>
                <circle cx="52" cy="68" r="9" fill="#ff6b81"/>
                <circle cx="52" cy="68" r="4" fill="#ffffff"/>
                <path d="M25,20 L55,55" stroke="#ff6b81" stroke-width="2" opacity="0.5"/>
            </svg>
        </div>
        <div class="patin-movil pm-2">
            <svg viewBox="0 0 100 100" width="100" height="100">
                <path d="M25,20 L45,20 L50,30 L55,55 L25,55 L20,35 Z" fill="#ffffff" opacity="0.8"/>
                <path d="M25,55 L55,55 L55,60 L25,60 Z" fill="#4a4a4a"/>
                <circle cx="30" cy="68" r="9" fill="#ff6b81"/>
                <circle cx="30" cy="68" r="4" fill="#ffffff"/>
                <circle cx="52" cy="68" r="9" fill="#ff6b81"/>
                <circle cx="52" cy="68" r="4" fill="#ffffff"/>
                <path d="M25,20 L55,55" stroke="#ff6b81" stroke-width="2" opacity="0.5"/>
            </svg>
        </div>
    </div>

    <div class="contenedor">
        <h1 class="patinaje-titulo">¡A Rodar!</h1>
        <p class="mensaje-principal">Mucha suerte en tu regreso al patinajee</p>
        <p class="firma">Te quieroo, Att: Cristian la bestia</p>
    </div>

</body>
</html>
